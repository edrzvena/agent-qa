[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-qa"
version = "0.1.0"
description = "AI agent that explores web apps in a real browser and reports bugs with evidence"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "playwright>=1.48",
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-qa = "agent_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
